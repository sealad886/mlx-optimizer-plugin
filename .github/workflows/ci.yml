name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Python and manifest validation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile scripts
        run: python -m py_compile plugins/mlx-optimizer/scripts/*.py

      - name: Validate JSON manifests
        run: |
          python -m json.tool plugin.json >/dev/null
          python -m json.tool .github/plugin/marketplace.json >/dev/null
          python -m json.tool .agents/plugins/marketplace.json >/dev/null
          python -m json.tool plugins/mlx-optimizer/.codex-plugin/plugin.json >/dev/null
